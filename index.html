<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
    <style>
        label { color: blue; }
    </style>
</head>
<body>
    <h1>Formularios</h1>
    <form action="procesa.php" method="post">
        <fieldset>
            <legend>Datos Personales</legend>
            <p>
                <label for="nombre">Nombre: </label>
                <input id="nombre" type="text" name="nombre">
            </p>
            <p>
                <label for="ape">Apellidos:</label>
                <input id="ape" type="text" name="apellidos">
            </p>
            <p>
                <label for="pass">Contraseña:</label>
                <input id="pass" type="password" name="password">
            </p>
            <p>
                <label>Género:</label>
                <input type="radio" name="genero" value="H" checked> Hombre
                <input type="radio" name="genero" value="M"> Mujer
            </p>
            <p>
                <input type="checkbox" id="fuma" name="fuma">
                <label for="fuma">Fumador</label>
            </p>
            <p>
                <label for="provincia">Provincia:</label>
                <select id="provincia" name="provincia">
                    <option value="esp">Española</option>
                    <option value="ue">Unión Europea</option>
                    <option value="no_ue">Fuera de la UE</option>
                </select>
            </p>
            <p>
                <label for="comentarios">Observaciones:</label><br>
                <textarea id="comentarios" name="comentarios" rows="5" cols="30">Escribe algo...</textarea>
            </p>
            <p>
                <label for="color">Color:</label>
                <input id="color" type="color" name="colorproducto">
            </p>
            <p>
                <label for="fecha_nac">Fecha Nacimiento:</label>
                <input id="fecha_nac" type="date" name="fecha_nac">
            </p>
            <p>
                <label for="edad">Edad:</label>
                <input id="edad" type="number" name="edad" min="0" max="100" value="1">
            </p>
            <p>
                <label for="email">E-mail:</label>
                <input id="email" type="email" name="email">
            </p>
            <p>
                <label for="foto">Adjuntar foto:</label>
                <input id="foto" type="file" name="foto">
            </p>
        </fieldset>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="reiniciar formulario">
        </p>
    </form>
</body>
</html>
